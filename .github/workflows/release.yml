name: Release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.426'
      - name: Validate version
        shell: pwsh
        run: |
          $version = '1.1.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Use a stable vMAJOR.MINOR.PATCH tag.' }
            $version = $Matches[1]
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Restore test dependencies
        run: dotnet restore tests/HexaWall.Tests/HexaWall.Tests.csproj --locked-mode --configfile NuGet.Config
      - name: Build and test
        run: dotnet run --project tests/HexaWall.Tests/HexaWall.Tests.csproj -c Release --no-restore
      - name: Restore release dependencies
        run: dotnet restore src/HexaWall/HexaWall.csproj -r win-x64 -p:SelfContained=true --locked-mode --configfile NuGet.Config
      - name: Publish self-contained single file
        run: dotnet publish src/HexaWall/HexaWall.csproj -c Release -r win-x64 --self-contained true --no-restore -p:Version=${{ env.APP_VERSION }} -o artifacts/publish
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$env:APP_VERSION" installer/HexaWall.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }
      - name: Package portable application and checksums
        shell: pwsh
        run: |
          Copy-Item LICENSE,THIRD-PARTY-NOTICES.md artifacts/publish/
          Copy-Item assets/licenses artifacts/publish/licenses -Recurse
          Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/HexaWall-$env:APP_VERSION-win-x64-portable.zip"
          $files = @('artifacts/publish/HexaWall.exe', "artifacts/HexaWall-$env:APP_VERSION-win-x64-portable.zip", "artifacts/installer/HexaWall-$env:APP_VERSION-win-x64-Setup.exe")
          $lines = $files | ForEach-Object { $h = Get-FileHash $_ -Algorithm SHA256; "$($h.Hash.ToLower())  $([IO.Path]::GetFileName($_))" }
          $lines | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: HexaWall-${{ env.APP_VERSION }}
          path: |
            artifacts/publish/HexaWall.exe
            artifacts/*portable.zip
            artifacts/installer/*Setup.exe
            artifacts/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @('artifacts/publish/HexaWall.exe', 'artifacts/SHA256SUMS.txt')
          $assets += (Get-ChildItem artifacts/*portable.zip,artifacts/installer/*Setup.exe).FullName
          gh release view "$env:GITHUB_REF_NAME" --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" @assets --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag --generate-notes --title "HexaWall $env:APP_VERSION"
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release failed' }

